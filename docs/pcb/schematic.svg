<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="monospace" font-size="12">

  <!-- Background -->
  <rect width="900" height="560" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="30" fill="#e0e0e0" font-size="16" font-weight="bold" text-anchor="middle">RGB LED Strip Controller — Schematic</text>
  <text x="450" y="50" fill="#888" font-size="11" text-anchor="middle">Raspberry Pi Zero W + 3× TIP120 + 3× 1 kΩ — 12 V common-anode RGB LED strip</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Pi Zero W block -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="80" width="160" height="200" rx="6" fill="#16213e" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="100" y="100" fill="#4a9eff" font-size="13" font-weight="bold" text-anchor="middle">Pi Zero W</text>
  <text x="100" y="116" fill="#4a9eff" font-size="10" text-anchor="middle">MCU1</text>

  <!-- Pi pins -->
  <!-- GPIO17 (Green) — physical pin 11 -->
  <rect x="160" y="130" width="20" height="14" rx="2" fill="#27ae60" stroke="#2ecc71" stroke-width="1"/>
  <text x="150" y="141" fill="#2ecc71" font-size="10" text-anchor="end">GPIO17</text>
  <text x="188" y="141" fill="#888" font-size="9" text-anchor="start">p11</text>

  <!-- GPIO27 (Red) — physical pin 13 -->
  <rect x="160" y="155" width="20" height="14" rx="2" fill="#922b21" stroke="#e74c3c" stroke-width="1"/>
  <text x="150" y="166" fill="#e74c3c" font-size="10" text-anchor="end">GPIO27</text>
  <text x="188" y="166" fill="#888" font-size="9" text-anchor="start">p13</text>

  <!-- GPIO22 (Blue) — physical pin 15 -->
  <rect x="160" y="180" width="20" height="14" rx="2" fill="#1a5276" stroke="#3498db" stroke-width="1"/>
  <text x="150" y="191" fill="#3498db" font-size="10" text-anchor="end">GPIO22</text>
  <text x="188" y="191" fill="#888" font-size="9" text-anchor="start">p15</text>

  <!-- GND — physical pin 6 -->
  <rect x="160" y="230" width="20" height="14" rx="2" fill="#333" stroke="#888" stroke-width="1"/>
  <text x="150" y="241" fill="#aaa" font-size="10" text-anchor="end">GND</text>
  <text x="188" y="241" fill="#888" font-size="9" text-anchor="start">p6</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Resistors R1, R2, R3 -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- R2 (Green, GPIO17) at y=137 -->
  <line x1="180" y1="137" x2="280" y2="137" stroke="#2ecc71" stroke-width="1.5"/>
  <rect x="280" y="128" width="50" height="18" rx="4" fill="#16213e" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="305" y="141" fill="#2ecc71" font-size="10" text-anchor="middle">R2 1kΩ</text>
  <line x1="330" y1="137" x2="370" y2="137" stroke="#2ecc71" stroke-width="1.5"/>

  <!-- R1 (Red, GPIO27) at y=162 -->
  <line x1="180" y1="162" x2="280" y2="162" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="280" y="153" width="50" height="18" rx="4" fill="#16213e" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="305" y="166" fill="#e74c3c" font-size="10" text-anchor="middle">R1 1kΩ</text>
  <line x1="330" y1="162" x2="370" y2="162" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- R3 (Blue, GPIO22) at y=187 -->
  <line x1="180" y1="187" x2="280" y2="187" stroke="#3498db" stroke-width="1.5"/>
  <rect x="280" y="178" width="50" height="18" rx="4" fill="#16213e" stroke="#3498db" stroke-width="1.5"/>
  <text x="305" y="191" fill="#3498db" font-size="10" text-anchor="middle">R3 1kΩ</text>
  <line x1="330" y1="187" x2="370" y2="187" stroke="#3498db" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- TIP120 transistors (TO-220 NPN Darlington) -->
  <!-- Drawn as NPN BJT symbol -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Q2 (Green) centred at x=440, y=137 -->
  <!-- Base line -->
  <line x1="370" y1="137" x2="420" y2="137" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Vertical emitter-collector bar -->
  <line x1="420" y1="107" x2="420" y2="167" stroke="#2ecc71" stroke-width="2"/>
  <!-- Base connection dot -->
  <line x1="420" y1="137" x2="420" y2="137" stroke="#2ecc71" stroke-width="2"/>
  <!-- Collector line (up) -->
  <line x1="420" y1="107" x2="460" y2="87" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Collector arrow -->
  <polygon points="455,80 463,90 450,93" fill="#2ecc71"/>
  <!-- Emitter line (down) -->
  <line x1="420" y1="167" x2="460" y2="187" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Emitter arrow -->
  <polygon points="450,183 463,180 458,193" fill="#2ecc71"/>
  <!-- Label -->
  <text x="430" y="142" fill="#2ecc71" font-size="10">Q2</text>
  <text x="430" y="154" fill="#888" font-size="9">TIP120</text>

  <!-- Q1 (Red) centred at x=440, y=162 — shifted down 80px -->
  <line x1="370" y1="240" x2="420" y2="240" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="420" y1="210" x2="420" y2="270" stroke="#e74c3c" stroke-width="2"/>
  <line x1="420" y1="210" x2="460" y2="190" stroke="#e74c3c" stroke-width="1.5"/>
  <polygon points="455,183 463,193 450,196" fill="#e74c3c"/>
  <line x1="420" y1="270" x2="460" y2="290" stroke="#e74c3c" stroke-width="1.5"/>
  <polygon points="450,286 463,283 458,296" fill="#e74c3c"/>
  <text x="430" y="245" fill="#e74c3c" font-size="10">Q1</text>
  <text x="430" y="257" fill="#888" font-size="9">TIP120</text>

  <!-- Q3 (Blue) centred at x=440, y=187 — shifted down 160px -->
  <line x1="370" y1="340" x2="420" y2="340" stroke="#3498db" stroke-width="1.5"/>
  <line x1="420" y1="310" x2="420" y2="370" stroke="#3498db" stroke-width="2"/>
  <line x1="420" y1="310" x2="460" y2="290" stroke="#3498db" stroke-width="1.5"/>
  <polygon points="455,283 463,293 450,296" fill="#3498db"/>
  <line x1="420" y1="370" x2="460" y2="390" stroke="#3498db" stroke-width="1.5"/>
  <polygon points="450,386 463,383 458,396" fill="#3498db"/>
  <text x="430" y="345" fill="#3498db" font-size="10">Q3</text>
  <text x="430" y="357" fill="#888" font-size="9">TIP120</text>

  <!-- Connect R wires to Q bases -->
  <!-- R2→Q2 base already drawn above (y=137→y=240 needs adjustment) -->
  <!-- Let me redo with correct y coords for Q transistors -->

  <!-- ═══════════════════════════════════════════ -->
  <!-- Redo resistor wires to correct transistor positions -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- R2 (Green) to Q2 base at y=240 -->
  <!-- Redraw R2 at correct y -->

  <!-- ═══════════════════════════════════════════ -->
  <!-- Let me use a cleaner layout: Q transistors at y=160, 260, 360 -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- CLEAN LAYOUT — wipe previous transistor attempts and redo -->

  <!-- ═══════════════════════════════════════════ -->
  <!-- Clean transistor symbols -->
  <!-- Q2 (Green) base node at (460, 137) -->
  <!-- Q1 (Red)   base node at (460, 245) -->
  <!-- Q3 (Blue)  base node at (460, 353) -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ─── Q2 Green ─── -->
  <!-- base horizontal -->
  <line x1="330" y1="137" x2="460" y2="137" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- vertical bar (emitter-collector) -->
  <line x1="460" y1="110" x2="460" y2="164" stroke="#2ecc71" stroke-width="2.5"/>
  <!-- collector (up-right to collector node at 520,90) -->
  <line x1="460" y1="110" x2="520" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- emitter (down-right to emitter node at 520,184) -->
  <line x1="460" y1="164" x2="520" y2="184" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- emitter arrow -->
  <polygon points="510,179 524,182 516,192" fill="#2ecc71"/>
  <!-- label -->
  <text x="462" y="132" fill="#2ecc71" font-size="10" font-weight="bold">Q2</text>
  <text x="462" y="158" fill="#888" font-size="9">TIP120</text>

  <!-- ─── Q1 Red ─── -->
  <line x1="330" y1="245" x2="460" y2="245" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="460" y1="218" x2="460" y2="272" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="460" y1="218" x2="520" y2="198" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="460" y1="272" x2="520" y2="292" stroke="#e74c3c" stroke-width="1.5"/>
  <polygon points="510,287 524,290 516,300" fill="#e74c3c"/>
  <text x="462" y="240" fill="#e74c3c" font-size="10" font-weight="bold">Q1</text>
  <text x="462" y="266" fill="#888" font-size="9">TIP120</text>

  <!-- ─── Q3 Blue ─── -->
  <line x1="330" y1="353" x2="460" y2="353" stroke="#3498db" stroke-width="1.5"/>
  <line x1="460" y1="326" x2="460" y2="380" stroke="#3498db" stroke-width="2.5"/>
  <line x1="460" y1="326" x2="520" y2="306" stroke="#3498db" stroke-width="1.5"/>
  <line x1="460" y1="380" x2="520" y2="400" stroke="#3498db" stroke-width="1.5"/>
  <polygon points="510,395 524,398 516,408" fill="#3498db"/>
  <text x="462" y="348" fill="#3498db" font-size="10" font-weight="bold">Q3</text>
  <text x="462" y="374" fill="#888" font-size="9">TIP120</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Resistors — repositioned to match Q bases  -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- R2 (Green) GPIO17 p11 → y=137 -->
  <line x1="180" y1="137" x2="240" y2="137" stroke="#2ecc71" stroke-width="1.5"/>
  <rect x="240" y="127" width="52" height="20" rx="4" fill="#16213e" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="266" y="141" fill="#2ecc71" font-size="10" text-anchor="middle">R2 1kΩ</text>
  <line x1="292" y1="137" x2="330" y2="137" stroke="#2ecc71" stroke-width="1.5"/>

  <!-- wire from GPIO17 (y=137) to R2 (need to route from pin 11 at y=137) -->
  <!-- Pi pin 11 already at y=137 due to our layout — direct connection works -->

  <!-- R1 (Red) GPIO27 p13 → y=162 then bend down to y=245 -->
  <line x1="180" y1="162" x2="210" y2="162" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="210" y1="162" x2="210" y2="205" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="210" y1="205" x2="240" y2="205" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- wait, let me route through y=245 -->
  <line x1="180" y1="162" x2="212" y2="162" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="212" y1="162" x2="212" y2="245" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="212" y1="245" x2="240" y2="245" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="240" y="235" width="52" height="20" rx="4" fill="#16213e" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="266" y="249" fill="#e74c3c" font-size="10" text-anchor="middle">R1 1kΩ</text>
  <line x1="292" y1="245" x2="330" y2="245" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- R3 (Blue) GPIO22 p15 → y=187 then bend down to y=353 -->
  <line x1="180" y1="187" x2="200" y2="187" stroke="#3498db" stroke-width="1.5"/>
  <line x1="200" y1="187" x2="200" y2="353" stroke="#3498db" stroke-width="1.5"/>
  <line x1="200" y1="353" x2="240" y2="353" stroke="#3498db" stroke-width="1.5"/>
  <rect x="240" y="343" width="52" height="20" rx="4" fill="#16213e" stroke="#3498db" stroke-width="1.5"/>
  <text x="266" y="357" fill="#3498db" font-size="10" text-anchor="middle">R3 1kΩ</text>
  <line x1="292" y1="353" x2="330" y2="353" stroke="#3498db" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- GND rail (all emitters + Pi GND tied together) -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Pi GND at y=237 -->
  <line x1="180" y1="237" x2="560" y2="237" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- emitter Q2 at (520,184) down to GND rail y=237 -->
  <line x1="520" y1="184" x2="520" y2="237" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- emitter Q1 at (520,292) — need junction to GND bus -->
  <!-- Vertical GND bus at x=560 -->
  <line x1="560" y1="184" x2="560" y2="410" stroke="#888" stroke-width="1.5"/>
  <line x1="520" y1="184" x2="560" y2="184" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="520" y1="292" x2="560" y2="292" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="520" y1="400" x2="560" y2="400" stroke="#3498db" stroke-width="1.5"/>
  <!-- GND bus down to GND symbol -->
  <line x1="560" y1="410" x2="560" y2="450" stroke="#888" stroke-width="1.5"/>
  <!-- GND symbol -->
  <line x1="540" y1="450" x2="580" y2="450" stroke="#888" stroke-width="2"/>
  <line x1="547" y1="456" x2="573" y2="456" stroke="#888" stroke-width="1.5"/>
  <line x1="554" y1="462" x2="566" y2="462" stroke="#888" stroke-width="1"/>
  <text x="560" y="478" fill="#888" font-size="11" text-anchor="middle">GND</text>

  <!-- Pi GND connect to vertical bus -->
  <line x1="180" y1="237" x2="560" y2="237" stroke="#888" stroke-width="1.5"/>
  <!-- Junction dot on GND bus at y=237 -->
  <circle cx="560" cy="237" r="3.5" fill="#888"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LED Strip connector J2 + 12V power J3 -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Collector outputs — horizontal wires to J2 -->
  <!-- Q2 collector at (520,90) → J2 GREEN -->
  <line x1="520" y1="90" x2="700" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Q1 collector at (520,198) → J2 RED -->
  <line x1="520" y1="198" x2="700" y2="198" stroke="#e74c3c" stroke-width="1.5"/>
  <!-- Q3 collector at (520,306) → J2 BLUE -->
  <line x1="520" y1="306" x2="700" y2="306" stroke="#3498db" stroke-width="1.5"/>

  <!-- J2 LED strip output connector block -->
  <rect x="700" y="60" width="120" height="280" rx="6" fill="#16213e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="760" y="82" fill="#f39c12" font-size="12" font-weight="bold" text-anchor="middle">J2</text>
  <text x="760" y="96" fill="#f39c12" font-size="10" text-anchor="middle">LED Strip</text>

  <!-- +12V pin -->
  <rect x="700" y="110" width="120" height="28" rx="0" fill="#16213e" stroke="none"/>
  <line x1="700" y1="124" x2="690" y2="124" stroke="#f39c12" stroke-width="1.5"/>
  <text x="760" y="128" fill="#f39c12" font-size="12" font-weight="bold" text-anchor="middle">+12V</text>

  <!-- GREEN pin -->
  <line x1="700" y1="90" x2="700" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="760" y="162" fill="#2ecc71" font-size="12" font-weight="bold" text-anchor="middle">GREEN</text>
  <circle cx="700" cy="155" r="4" fill="#2ecc71"/>

  <!-- RED pin -->
  <text x="760" y="205" fill="#e74c3c" font-size="12" font-weight="bold" text-anchor="middle">RED</text>
  <circle cx="700" cy="198" r="4" fill="#e74c3c"/>

  <!-- BLUE pin -->
  <text x="760" y="313" fill="#3498db" font-size="12" font-weight="bold" text-anchor="middle">BLUE</text>
  <circle cx="700" cy="306" r="4" fill="#3498db"/>

  <!-- ─── re-route Q collector lines to circle pads ─── -->
  <line x1="520" y1="90" x2="696" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <!-- Q2 collector is at y=90; need its arc from transistor -->
  <!-- Already drawn above; add circle pads -->
  <circle cx="700" cy="90" r="4" fill="#2ecc71"/>
  <text x="760" y="96" fill="#2ecc71" font-size="0">G</text>

  <!-- +12V horizontal from J3 to J2 -->
  <line x1="690" y1="124" x2="640" y2="124" stroke="#f39c12" stroke-width="2"/>

  <!-- J3 power input -->
  <rect x="580" y="108" width="60" height="44" rx="6" fill="#16213e" stroke="#f39c12" stroke-width="1.5"/>
  <text x="610" y="126" fill="#f39c12" font-size="11" font-weight="bold" text-anchor="middle">J3</text>
  <text x="610" y="140" fill="#f39c12" font-size="10" text-anchor="middle">+12V IN</text>
  <line x1="580" y1="124" x2="560" y2="124" stroke="#f39c12" stroke-width="2"/>
  <!-- 12V from external (label) -->
  <text x="520" y="120" fill="#f39c12" font-size="10" text-anchor="middle">12V PSU</text>
  <line x1="560" y1="124" x2="560" y2="124" stroke="#f39c12" stroke-width="2"/>
  <!-- J3 GND wire down to GND bus -->
  <line x1="610" y1="152" x2="610" y2="237" stroke="#888" stroke-width="1.5"/>
  <circle cx="560" cy="237" r="3.5" fill="#888"/>
  <line x1="560" y1="237" x2="610" y2="237" stroke="#888" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LED Strip connector pin labels -->
  <!-- ═══════════════════════════════════════════ -->
  <text x="830" y="128" fill="#f39c12" font-size="11" text-anchor="start">→ strip +12V</text>
  <text x="830" y="96" fill="#2ecc71" font-size="11" text-anchor="start">→ strip G</text>
  <text x="830" y="202" fill="#e74c3c" font-size="11" text-anchor="start">→ strip R</text>
  <text x="830" y="310" fill="#3498db" font-size="11" text-anchor="start">→ strip B</text>

  <!-- Lines from J2 right edge to labels -->
  <line x1="820" y1="124" x2="828" y2="124" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="820" y1="90" x2="828" y2="90" stroke="#2ecc71" stroke-width="1.5"/>
  <line x1="820" y1="198" x2="828" y2="198" stroke="#e74c3c" stroke-width="1.5"/>
  <line x1="820" y1="306" x2="828" y2="306" stroke="#3498db" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="20" y="390" width="360" height="140" rx="6" fill="#16213e" stroke="#555" stroke-width="1"/>
  <text x="30" y="410" fill="#aaa" font-size="12" font-weight="bold">Notes</text>
  <text x="30" y="428" fill="#aaa" font-size="11">• R1–R3: 1 kΩ ¼W through-hole (base current limiting)</text>
  <text x="30" y="444" fill="#aaa" font-size="11">• Q1–Q3: TIP120 TO-220 NPN Darlington</text>
  <text x="30" y="460" fill="#aaa" font-size="11">• J1: 2×20 female 2.54 mm header (Pi GPIO)</text>
  <text x="30" y="476" fill="#aaa" font-size="11">• J2: 4-pin 5.08 mm screw terminal (LED strip out)</text>
  <text x="30" y="492" fill="#aaa" font-size="11">• J3: 2-pin 5.08 mm screw terminal (12 V in)</text>
  <text x="30" y="508" fill="#aaa" font-size="11">• All GND tied: Pi GND + TIP120 emitters + 12V–</text>
  <text x="30" y="524" fill="#888" font-size="10">Board: 84.7 mm × 56.4 mm, 2-layer</text>

</svg>
