# Central configuration file

# Pin assignments:
# BCM GPIO numbers for the RGB PWM channels of the LED strip.
[pins]
red   = 27
green = 17
blue  = 22

# Time-based color profiles:
# "morning" is active from 00:00 until 12:00; "evening" from 12:00 until 24:00.
# Values are 8-bit channel intensities (0–255).
[profile.morning]
red   = 150
green = 200
blue  = 10

[profile.evening]
red   = 200
green = 20
blue  = 0