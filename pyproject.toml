[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "led-strip-light"
version = "0.1.0"
description = "RGB LED strip controller for Raspberry Pi with HTTP API, CLI, and HomeKit integration"
requires-python = ">=3.13"
dependencies = [
    "flask~=3.1",
    "pigpio~=1.78",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-mock~=3.15",
    "pytest-cov~=7.1",
    "ruff>=0.15.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/led", "src/config", "src/cli", "src/utils"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
relative_files = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
