[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "led-strip-light"
version = "1.0.0"
description = "RGB LED strip controller for Raspberry Pi with HTTP API, CLI, and HomeKit integration"
requires-python = ">=3.8"
dependencies = [
    "configparser>=7.1.0",
    "flask>=2.3.2",
    "pigpio>=1.78",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]

[tool.hatch.build.targets.wheel]
packages = ["src/led", "src/config", "src/cli", "src/utils"]

[tool.pytest.ini_options]
minversion = "8.2"
# -ra: show extra test summary info
# -v: verbose output
# --cov=<module>: measure coverage of project modules
# --cov-report=term-missing: show lines that need coverage
addopts = "-ra -v --cov=cli --cov=config --cov=led --cov=http_server --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
relative_files = true
