[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "led-strip-light"
version = "1.0.0"
description = "RGB LED strip controller for Raspberry Pi with HTTP API, CLI, and HomeKit integration"
requires-python = ">=3.9"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "flask>=3.1.3",
    "pigpio>=1.78",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]

[tool.hatch.build.targets.wheel]
packages = ["src/led", "src/config", "src/cli", "src/utils"]

[tool.pytest.ini_options]
minversion = "8.2"
# -ra: show extra test summary info
# -v: verbose output
# --cov=<module>: measure coverage of project modules
# --cov-report=term-missing: show lines that need coverage
addopts = "-ra -v --cov=cli --cov=config --cov=led --cov=http_server --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
relative_files = true
